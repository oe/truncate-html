name: CI

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.18.1', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies, test and build
        # The existing prepublish hook runs tests and the build on installation.
        run: yarn install --frozen-lockfile --non-interactive
      - name: Check types, lint and the published package
        run: yarn typecheck && yarn lint && yarn test:package
      - name: Upload coverage to Codecov
        if: matrix.node == '24.x'
        uses: codecov/codecov-action@v5
        with:
          slug: oe/truncate-html
          token: ${{ secrets.CODECOV_TOKEN }}
